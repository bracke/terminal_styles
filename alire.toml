name = "terminal_styles"
description = "ANSI terminal styling: semantic roles, colours, TTY-aware policy"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/terminal_styles"
long-description = "terminal_styles is ANSI terminal decoration for programs that write status output: semantic roles such as info, success, error, warning, muted and header; explicit decorations including bold, faint, italic, underline, blink, inverse, hidden and strike; foreground and background colours with their bright variants; and ASCII markers for output that has to survive a pipe. Colour policy is TTY-aware and explicit -- automatic, always, or never -- so a program can honour a terminal, a redirect and a user's preference without each caller deciding for itself."
tags = ["terminal", "ansi", "color"]

[[depends-on]]
gnat_native = "=15.2.1"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/tests"]

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3). Keeping every root on the same profile lets them share object
# files instead of forcing a rebuild whenever a different root is built.
[build-profiles]
"*" = "development"
